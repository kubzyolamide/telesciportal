<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleSci Academic Portal Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .premium-shadow { box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.05); }
        .glass-effect { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="fixed top-5 left-1/2 -translate-x-1/2 z-[99999] w-full max-w-md px-4 animate-fade-in">
            {% for message in messages %}
            <div class="glass-effect border border-slate-200/80 shadow-2xl rounded-2xl p-4 text-slate-800 text-xs font-bold flex justify-between items-center mb-2">
                <span class="flex items-center gap-2">🔔 {{ message }}</span>
                <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600 ml-2">✕</button>
            </div>
            {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-6 text-[10px] font-bold tracking-wider text-slate-400 border-t border-slate-100 mt-auto uppercase">
        © 2026 Department of Telecommunication Science, University of Ilorin. Designed for Excellence.
    </footer>

</body>
</html>
